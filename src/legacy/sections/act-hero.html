<section
  class="relative z-10 w-full h-screen min-h-[700px] flex flex-col justify-between px-6 sm:px-12 lg:px-16 pt-28 pb-10 overflow-hidden"
  id="act-hero">
  <!-- Ambient Video Background (VP9 WebM + Faststart MP4 for instant 60fps playback) -->
  <video id="hero-bg-video" class="hero-video-bg" autoplay muted loop playsinline webkit-playsinline preload="metadata"
    tabindex="-1" aria-hidden="true">
    <source src="/hero_video.webm" type="video/webm" />
    <source src="/hero_video.mp4" type="video/mp4" />
  </video>
  <!-- 3D WebGL Canvas (hidden) -->
  <div class="absolute inset-0 z-0 w-full h-full" id="hero-canvas-stage" style="display: none;"></div>
  <div class="hero-vignette"></div>
  <!-- Hidden eyebrow anchor for timeline compatibility -->
  <div id="hero-eyebrow" class="hidden" aria-hidden="true"></div>
  <!-- Lower-Center Focused Editorial Composition — Single Strong Headline -->
  <div class="relative z-20 w-full max-w-4xl mx-auto text-center flex flex-col items-center mt-auto mb-6"
    id="hero-copy-container">
    <div class="overflow-hidden pb-2 mb-4">
      <h1
        class="satin-headline font-light text-4xl sm:text-6xl lg:text-[72px] leading-[1.05] opacity-100 translate-y-0 transition-all duration-700"
        id="hero-main-headline">
        Transforming the Future of <span class="satin-champagne font-normal">Healthcare.</span>
      </h1>
    </div>
    <p class="font-light text-sm sm:text-base lg:text-lg text-stonewarm max-w-2xl leading-relaxed mb-8 opacity-100 translate-y-0 transition-all duration-700"
      id="hero-subcopy">
      An integrated healthcare ecosystem connecting clinical intelligence, hospital operations and patient care.
    </p>
    <div class="flex flex-wrap items-center justify-center gap-4 opacity-100 translate-y-0 transition-all duration-700" id="hero-ctas">
      <a class="btn-primary-cinema group" href="#act-mission">
        <span>Explore the Ecosystem</span>
        <svg class="w-3.5 h-3.5 ml-2.5 transition-transform duration-300 group-hover:translate-x-1" fill="none"
          stroke="currentColor" viewbox="0 0 24 24">
          <path d="M17 8l4 4m0 0l-4 4m4-4H3" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
        </svg>
      </a>
      <a class="btn-secondary-cinema" href="#act-concierge">
        <span>Book a Demo</span>
      </a>
    </div>
  </div>
  <!-- Subtle Scroll Indicator -->
  <a aria-label="Scroll to Mission Section"
    class="relative z-20 mx-auto flex flex-col items-center gap-2 text-[9px] font-medium tracking-[0.3em] uppercase text-stonewarm/75 hover:text-champagne transition-colors"
    href="#act-mission">
    <span>Scroll</span>
    <span class="w-[1px] h-7 bg-gradient-to-b from-champagne/70 to-transparent"></span>
  </a>
</section>
